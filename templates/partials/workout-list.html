<div>
    <form id="add-workout-form"></form>

    <div class="workout-view mt-4">
        <ul>
            {{range .}}
            <li>
                <div class="title">
                    <h3 class="ms-2">Workout {{.ID}} {{.Date.Format "Jan 02, 2006 15:04 PM"}}</h3>
                    <div class="me-2">
                        <button type="button" data-workout-id="{{.ID}}" data-workout-date="{{.Date}}">
                            Add Exercise
                        </button>
                        <button type="button" data-test-id="{{.ID}}">
                            Tester
                        </button>
                    </div>
                </div>
                <div style="display: flex; flex-direction: column;" id="selected-workout"></div>
            </li>
            {{end}}
        </ul>
    </div>
</div>

<script>
    import { Patch } from "/static/js/request.js"
    import { swapDirect } from "/static/js/swap.js"

    //todo: Add a way to specify multiple data-* per function
    //so, if addExerciseMovement needed another value like data-workout-name
    //you could do:
    //
    //[at]handle:data-workout-id:data-workout-name
    //
    //and they'd both be passed into "e"

    //in main.js, you probably need a way to aggregate all the dataset items

    //@handle:data-workout-id:data-workout-date
    export const addExerciseMovement = (e) => {
        console.log("e: ", e)
        const id = e.workoutId

        Patch("/api/workouts/add/movement", id, null)
            .then((res) => {
                swapDirect("selected-workout", res)
            })
            .catch((err) => {
                console.log("patch err: ", err)
            })
        //console.log("workout id: ", e.target.dataset.workoutId);
    }

</script>
