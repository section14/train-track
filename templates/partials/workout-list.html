<div>
    <form id="add-workout-form"></form>

    <div class="workout-view mt-4">
        <ul>
            {{range .}}
            <li>
                <div class="title">
                    <h3 class="ms-2">Workout {{.ID}} {{.Date.Format "Jan 02, 2006 15:04 PM"}}</h3>
                    <div class="me-2">
                        <button type="button" data-workout-id="{{.ID}}" data-workout-date="{{.Date}}">
                            Add Exercise
                        </button>
                        <button type="button" data-test-id="{{.ID}}">
                            Tester
                        </button>
                    </div>
                </div>
                <partial-loader
                    target-id="workout-{{.ID}}"
                    endpoint="/api/partials/workouts/{{.ID}}">
                </partial-loader>
                <div id="workout-{{.ID}}" style="display: flex; flex-direction: column;"></div>
            </li>
            {{end}}
        </ul>
    </div>
</div>

<script>
    import { Patch } from "/static/js/request.js"
    import { swapDirect } from "/static/js/swap.js"

    //@handle:data-workout-id:data-workout-date
    export const addExerciseMovement = (e) => {
        const id = e.workoutId

        Patch("/api/workouts/add/movement", id, null)
            .then((res) => {
                swapDirect(`workout-${id}`, res)
            })
            .catch((err) => {
                console.log("patch err: ", err)
            })
        //console.log("workout id: ", e.target.dataset.workoutId);
    }

    //@handle:data-test-id
    export const addTestThingy = (e) => {
        console.log("testes: ", e)
        //console.log("workout id: ", e.target.dataset.workoutId);
    }
</script>
