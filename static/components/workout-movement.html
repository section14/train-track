<template id="workout-movement-template">
    <style>
        :host {
            display: flex;
            flex: 1;
        }

        .container {
            display: grid;
            flex: 1 1 100%;
            align-items: center;
            gap: var(--spacing-2);
            grid-template-rows: 1fr;
            grid-template-columns: 1fr 1fr 1fr 1fr min-content;
        }

        button {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: inherit;
            color: var(--primary);
            background-color: var(--med);
            border: none;
            border-radius: 0.375rem;
            width: 2.5rem;
            height: 2.5rem;
            transition: color 0.25s ease, background-color 0.25s ease;

            & svg {
                width: 2rem;
                height: 2rem;
            }
        }

        button:focus {
            outline: none;
        }

        button:hover {
            cursor: pointer;
            background-color: oklch(from var(--primary) calc(l + 0.2) c h);
        }

        .btn-delete {
            color: var(--med-400);
            background-color: var(--dark);
            margin-left: 0.5rem;
        }

        .btn-delete:hover {
            color: oklch(from var(--danger) calc(l + 0.2) c h);
            background-color: oklch(from var(--dark) calc(l + 0.08) c h);
        }

        .btn-delete:disabled {
            cursor: not-allowed;
            color: oklch(from var(--dark) calc(l + 0.1) c h);
            background-color: oklch(from var(--dark) calc(l - 0.08) c h);
        }
    </style>
    <form id="movement-form" class="container">
        <select-exercise id="exercise" name="exercise" label="Exercise"></select-exercise>
        <form-input id="sets" name="sets" type="number" label="Sets" placeholder="Enter Sets"></form-input>
        <form-input id="reps" name="reps" type="number" label="Reps" placeholder="Enter Reps"></form-input>
        <form-input id="weight" name="weight" type="number" label="Weight" placeholder="Enter Weight"></form-input>
        <div id="button-group" style="display: flex; flex: 1; align-items: center;">
            <save-indicator id="saver"></save-indicator>
            <button id="delete-mvmt" type="button" class="btn-delete">
                <svg-icon icon="remove"></svg-icon>
            </button>
        </div>
    </form>
</template>
