<template id="save-indicator-template">
    <style>
        .show {
            display: flex;
        }

        .hide {
            display: none;
        }

        .spinner {
            width: 2rem;
            height: 2rem;
            color: var(--danger);
            justify-content: center;
            align-items: center;
            animation: pulse 1s ease-in-out infinite;

            & svg {
                width: 100%;
            }
        }

        .check {
            width: 2rem;
            height: 2rem;
            color: var(--success);
            justify-content: center;
            align-items: center;

            & svg {
                width: 100%;
            }
        }

        @keyframes pulse {
            0% {
                color: var(--danger);
            }
            50% {
                color: oklch(from var(--danger) calc(l + 0.8) c h);
            }
            100% {
                color: var(--danger);
            }
        }
    </style>

    <div id="spinner" class="spinner hide">
